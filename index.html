<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Панель руководителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2a78d6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(138,143,152,.22);
    --green: #1baf7a; --red: #e34948; --orange: #eb6834; --blue: #2a78d6; --violet: #6250d6; --yellow: #eda100;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", Arial, sans-serif;
    font-size: 15px; line-height: 1.4; padding: 14px 14px calc(84px + env(safe-area-inset-bottom));
  }
  button { font-family: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* шапка */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .top h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.4px; }
  .top .sub { color: var(--hint); font-size: 13px; margin-top: 1px; }
  .back { border: none; background: none; color: var(--accent); font-size: 15px; padding: 0 0 8px; cursor: pointer; }
  .icon-btn { border: none; background: var(--bg); color: var(--text); width: 40px; height: 40px; border-radius: 50%;
    font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .icon-btn.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* переключатели периода */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px 12px; padding: 0 14px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: none; border-radius: 20px; padding: 8px 14px; font-size: 14px; font-weight: 500;
    background: var(--bg); color: var(--text); cursor: pointer; }
  .chip.active { background: var(--accent); color: var(--accent-text); }

  /* карточки */
  .card { background: var(--bg); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { color: var(--hint); font-weight: 400; font-size: 13px; }
  .card h2 a { color: var(--accent); font-weight: 500; font-size: 14px; text-decoration: none; cursor: pointer; }
  .hero .label { color: var(--hint); font-size: 14px; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; margin: 2px 0 6px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--hint); font-size: 14px; }
  .meta b { color: var(--text); font-weight: 600; }

  .forecast { background: linear-gradient(135deg, rgba(98,80,214,.14), rgba(42,120,214,.10)); }
  .forecast .big { font-size: 26px; }

  .pill { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
  .pill.up { color: var(--green); background: rgba(27,175,122,.13); }
  .pill.down { color: var(--red); background: rgba(227,73,72,.13); }
  .pill.flat { color: var(--hint); background: rgba(138,143,152,.13); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .kpi { background: var(--bg); border-radius: 14px; padding: 12px 13px; min-width: 0; }
  .kpi.click { cursor: pointer; }
  .kpi .label { color: var(--hint); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .value { font-size: 19px; font-weight: 700; margin: 4px 0; letter-spacing: -0.3px; white-space: nowrap; }
  .grid.three .kpi .value { font-size: 16px; }
  .kpi .small { color: var(--hint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }

  .chart-wrap { position: relative; height: 230px; }
  .chart-wrap.small { height: 150px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--hint); margin-bottom: 8px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .tip { color: var(--hint); font-size: 12px; text-align: center; margin-top: 8px; }

  .bar-row { margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row.click { cursor: pointer; }
  .bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 5px; }
  .bar-top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-top .val { flex: none; font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }

  /* списки */
  .row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-top: 0.5px solid var(--line); }
  .row:first-child { border-top: none; padding-top: 2px; }
  .row:last-child { padding-bottom: 0; }
  .row.click { cursor: pointer; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex: none; }
  .row .info { flex: 1; min-width: 0; }
  .row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--hint); font-size: 13px; }
  .row .right { text-align: right; flex: none; font-weight: 600; font-size: 14px; }
  .red { color: var(--red); } .green { color: var(--green); } .muted { color: var(--hint); font-weight: 400; }
  .btn-small { border: none; background: var(--bg2); color: var(--accent); border-radius: 10px; padding: 7px 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }

  .search { width: 100%; border: none; outline: none; background: var(--bg); color: var(--text); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; margin-bottom: 10px; }
  .search::placeholder { color: var(--hint); }

  .contract { padding: 12px 0; border-top: 0.5px solid var(--line); }
  .contract:first-child { border-top: none; padding-top: 0; }
  .contract .t { font-weight: 600; margin-bottom: 6px; }
  .contract .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--hint); margin-top: 6px; }
  .contract .facts b { color: var(--text); font-weight: 600; }

  .month-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .month-head .chev { color: var(--hint); transition: transform .2s; }
  .month.open .chev { transform: rotate(90deg); }
  .month .people { display: none; margin-top: 10px; }
  .month.open .people { display: block; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .actions.one { grid-template-columns: 1fr; }
  .btn { border: none; border-radius: 12px; padding: 13px 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: var(--bg); color: var(--accent); }
  .btn:disabled { opacity: .6; }

  .warn { font-size: 13px; color: var(--hint); background: rgba(237,161,0,.13); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .empty { color: var(--hint); font-size: 14px; padding: 4px 0; }

  .skeleton { background: linear-gradient(90deg, rgba(138,143,152,.12) 25%, rgba(138,143,152,.22) 50%, rgba(138,143,152,.12) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 14px; margin-bottom: 12px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .state { text-align: center; padding: 56px 16px; }
  .state .emoji { font-size: 48px; }
  .state h3 { margin: 12px 0 6px; font-size: 18px; }
  .state p { color: var(--hint); margin: 0; }
  .fade-in { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* нижнее меню */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex;
    border-top: 0.5px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  .tab { flex: 1; border: none; background: none; color: var(--hint); display: flex; flex-direction: column; align-items: center;
    gap: 2px; font-size: 11px; font-weight: 500; padding: 4px 0; cursor: pointer; }
  .tab .ic { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .65; }
  .tab.active { color: var(--accent); }
  .tab.active .ic { filter: none; opacity: 1; }

  /* нижняя шторка (детали месяца) */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 8; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--bg2);
    border-radius: 20px 20px 0 0; padding: 8px 14px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 9; }
  .sheet.show { transform: none; }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(30px);
    opacity: 0; background: rgba(20,20,20,.92); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px;
    transition: all .3s ease; z-index: 20; max-width: 90%; text-align: center; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* новая главная */
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(138,143,152,.16); margin-bottom: 6px; }
  .seg button { height: 38px; border: none; border-radius: 10px; background: transparent; color: var(--hint); font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .period { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .arrow { width: 44px; height: 44px; border: none; background: none; color: var(--text); font-size: 26px; line-height: 1; cursor: pointer; }
  .arrow:disabled { color: var(--line); cursor: default; }
  .pl { text-align: center; }
  .pl .t { font-size: 16px; font-weight: 600; }
  .pl .s { font-size: 12px; color: var(--hint); }
  .pl .s.prelim { color: #c27c0e; }
  .banner { background: rgba(237,161,0,.14); color: var(--text); border-radius: 14px; padding: 11px 13px; font-size: 13px; line-height: 1.45; margin-bottom: 12px; }
  .tap { display: block; width: 100%; border: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
  .link { color: var(--accent); font-size: 14px; font-weight: 500; }
  .meta.split { justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--line); }
  .bars { display: grid; gap: 4px; align-items: end; }
  .bcol { border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
  .bv { font-size: 10px; color: var(--hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bv.on { color: var(--text); font-weight: 700; }
  .bv.red { color: var(--red); }
  .bwrap { height: 88px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .nwrap { height: 16px; width: 100%; display: flex; justify-content: center; }
  .cb { display: block; width: 70%; max-width: 26px; border-radius: 6px 6px 2px 2px; background-color: rgba(42,120,214,.35); }
  .cb.sel { background-color: var(--blue); }
  .cb.neg { background-color: var(--red); border-radius: 2px 2px 6px 6px; }
  .cb.pre { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, transparent 3px 7px); }
  .base { height: 1px; width: 100%; background: var(--line); }
  .bl { font-size: 11px; color: var(--hint); }
  .bl.on { color: var(--text); font-weight: 700; }
  .tile { border: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 128px; }
  .tile .tt { color: var(--hint); font-size: 14px; }
  .tile .chev { color: var(--hint); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .badge i { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
  .badge.b-ok { color: #12935f; } .badge.b-ok i { background: var(--green); }
  .badge.b-warn { color: #c27c0e; } .badge.b-warn i { background: var(--yellow); }
  .badge.b-risk { color: var(--red); } .badge.b-risk i { background: var(--red); }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 2px 10px; font-size: 19px; font-weight: 700; }
  .section-title small { font-size: 13px; font-weight: 400; color: var(--hint); }
  .news { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin-bottom: 10px; }
  .news .nt { font-weight: 600; line-height: 1.35; }
  .news .nx { font-size: 13px; color: var(--hint); margin-top: 2px; line-height: 1.4; }
  .ic { width: 32px; height: 32px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .ic.i-ok { background: rgba(27,175,122,.15); color: #12935f; }
  .ic.i-warn { background: rgba(237,161,0,.17); color: #c27c0e; }
  .ic.i-risk { background: rgba(227,73,72,.14); color: var(--red); }
  .ic.i-info { background: rgba(42,120,214,.14); color: var(--blue); }
  .tips { padding: 4px 16px; }
  .tipr { display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-top: 0.5px solid var(--line); }
  .tipr:first-child { border-top: none; }
  .tipr .tb { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
  .num-badge { width: 26px; height: 26px; border-radius: 13px; flex: none; background: rgba(42,120,214,.14); color: var(--blue); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 0.5px solid var(--line); font-size: 15px; }
  .line:first-child { border-top: none; padding-top: 2px; }
  .line:last-child { padding-bottom: 2px; }
  .line span:first-child { display: flex; flex-direction: column; }
  .line small { font-size: 12px; color: var(--hint); }
  .line span:last-child { font-weight: 600; white-space: nowrap; }
  .line.bold { font-weight: 700; }
  .line.bold span:last-child { font-weight: 700; }
  .tip-text { color: var(--hint); font-size: 13px; text-align: center; padding: 4px 12px 12px; line-height: 1.45; }

  /* единый стиль: иконки, поиск, кнопки */
  .i { display: block; flex: none; }
  .tab .ic { filter: none; opacity: 1; display: flex; }
  .tab.active .ic { filter: none; }
  .btn, .btn-small, .back, .link { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .back { gap: 2px; }
  .link { gap: 2px; }
  .btn-small { gap: 5px; }
  .arrow { display: flex; align-items: center; justify-content: center; }
  .icon-btn span { display: flex; }
  .banner { display: flex; gap: 10px; align-items: flex-start; }
  .banner .i { margin-top: 1px; color: #c27c0e; }
  .state-ic { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--accent); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
  .toast { display: flex; align-items: center; gap: 8px; }
  .toast .i { color: #4ade80; }
  .search-wrap { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 12px; padding: 0 14px; margin-bottom: 10px; color: var(--hint); }
  .search-wrap .search { margin: 0; padding: 12px 0; background: transparent; flex: 1; min-width: 0; }
  .seg.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat .label { white-space: nowrap; }
  .ib { border-radius: 12px; }
  .ib.blue { background: rgba(42,120,214,.13); color: var(--blue); }
  .ib.green { background: rgba(27,175,122,.14); color: #12935f; }
  .ib.violet { background: rgba(98,80,214,.13); color: var(--violet); }
  .ib.orange { background: rgba(235,104,52,.13); color: var(--orange); }
  .chev { display: flex; color: var(--hint); }
  .contract .t { display: flex; gap: 8px; align-items: center; }
  .contract .t .i { color: var(--hint); }
  .right .s { font-weight: 400; }
  .muted .i { color: var(--green); }
  .month .chev { transition: transform .2s; }
  .chip { font-family: inherit; }
  .seg button, .btn, .btn-small, .chip, .tab { font-family: inherit; }
</style>
</head>
<body>

<main id="screen"></main>

<nav class="tabbar">
  <button class="tab active" data-tab="home"><span class="ic" data-icon="home"></span>Главная</button>
  <button class="tab" data-tab="clients"><span class="ic" data-icon="users"></span>Клиенты</button>
  <button class="tab" data-tab="money"><span class="ic" data-icon="wallet"></span>Деньги</button>
  <button class="tab" data-tab="reports"><span class="ic" data-icon="file"></span>Отчёты</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
  // >>> ВСТАВЬ СЮДА ссылку веб-приложения Apps Script (то же, что WEBAPP_URL) <<<
  const API_URL = 'https://script.google.com/macros/s/AKfycbwzwKq4Px6DcGaG-ce14NJ9eDpRmA1k1SvC-Hmh7_FaO4iloQoY35H6qsYTy9TlenHX/exec';

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const isDark = tg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  const S = { tab: 'home', mode: 'month', offset: { month: 0, quarter: 0, year: 0 }, payPeriod: 'lm', client: null, clientFilter: 'all', search: '', sheet: false, payroll: false };
  const memo = {};
  const charts = {};
  const screen = document.getElementById('screen');
  const PERIODS = [['tm', 'Этот месяц'], ['lm', 'Прошлый месяц'], ['tq', 'Квартал'], ['ty', 'Этот год'], ['ly', 'Прошлый год']];
  const COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#6250d6', '#e87ba4', '#0ea5b7', '#8a8f98'];

  // ================= форматирование =================
  const fmt = n => (n < 0 ? '−' : '') + Math.round(Math.abs(n)).toLocaleString('ru-RU').replace(/[\s,]/g, ' ') + ' ₸';
  const short = n => {
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e9) return s + (a / 1e9).toFixed(1).replace('.', ',') + ' млрд ₸';
    if (a >= 1e6) return s + (a / 1e6).toFixed(1).replace('.', ',') + ' млн ₸';
    if (a >= 1e3) return s + Math.round(a / 1e3) + ' тыс ₸';
    return s + Math.round(a) + ' ₸';
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function delta(cur, prev, inverse) {
    if (!prev) return '';
    const pct = Math.round((cur - prev) / Math.abs(prev) * 100);
    if (pct === 0) return '<span class="pill flat">= 0%</span>';
    const good = inverse ? pct < 0 : pct > 0;
    return '<span class="pill ' + (good ? 'up' : 'down') + '">' + (pct > 0 ? '▲' : '▼') + ' ' + Math.abs(pct) + '%</span>';
  }
  function initials(name) {
    const w = String(name).replace(/^(ТОО|ИП|АО|ООО|TOO|LLP)\s+/i, '').replace(/["«»]/g, '').trim().split(/\s+/);
    return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function avatar(name) {
    let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const c = COLORS[h % (COLORS.length - 1)];
    return '<div class="avatar" style="background:' + c + '22;color:' + c + '">' + esc(initials(name)) + '</div>';
  }
  const haptic = t => { try { tg && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
  function toast(text) {
    const t = document.getElementById('toast');
    t.innerHTML = I('check', 18, 2.4) + '<span>' + esc(text) + '</span>'; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ================= иконки =================
  const ICON_PATHS = {

  };
  function I(name, size, sw) {
    return '<svg class="i" width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON_PATHS[name] + '</svg>';
  }
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = I(el.dataset.icon, 22, 1.8); });

  // ================= запросы =================
  async function api(params, opts) {
    opts = opts || {};
    const key = JSON.stringify(params);
    if (!opts.action && !opts.refresh && memo[key]) return memo[key];
    const q = new URLSearchParams(Object.assign({}, params, { initData: tg ? tg.initData : '', refresh: opts.refresh ? '1' : '0' }));
    const res = await (await fetch(API_URL + '?' + q.toString())).json();
    if (!res.ok) { const e = new Error(res.error); e.res = res; throw e; }
    if (!opts.action) memo[key] = res.data;
    return res.data;
  }

  function errorState(e) {
    const r = e.res || {};
    if (r.error === 'access') return state('lock', 'Нет доступа', 'Попросите администратора добавить ваш ID: ' + r.id);
    if (r.error === 'auth') return state('clock', 'Сессия устарела', 'Закройте панель и откройте её снова из бота.');
    if (r.error === 'server') return state('alert', 'Не удалось загрузить данные', 'Попробуйте обновить через минуту.');
    return state('cloud', 'Нет связи', 'Проверьте интернет и обновите страницу.');
  }
  const state = (icon, title, text) => '<div class="state fade-in"><div class="state-ic">' + I(icon, 28, 1.8) + '</div><h3>' + title + '</h3><p>' + text + '</p></div>';
  const skel = (...h) => h.map(x => '<div class="skeleton" style="height:' + x + 'px"></div>').join('');

  // кнопка-действие: отправить в чат (акт, отчёт, Excel)
  async function action(btn, params, okText) {
    haptic('medium');
    const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try { await api(params, { action: true }); toast(okText); }
    catch (e) { toast('Не получилось, попробуйте ещё раз'); }
    btn.disabled = false; btn.innerHTML = old;
  }

  // ================= общие блоки =================
  function header(title, sub, opts) {
    opts = opts || {};
    return (opts.back ? '<button class="back" data-back>' + I('left', 18, 2.2) + esc(opts.back) + '</button>' : '') +
      '<div class="top"><div style="min-width:0"><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
      (opts.refresh === false ? '' : '<button class="icon-btn" data-refresh aria-label="Обновить"><span>' + I('refresh', 19) + '</span></button>') + '</div>';
  }
  function chips(active, attr) {
    return '<div class="chips">' + PERIODS.map(p => '<button class="chip' + (p[0] === active ? ' active' : '') + '" ' + attr + '="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>';
  }
  function kpi(label, value, sub, color, attrs) {
    return '<div class="kpi' + (attrs ? ' click' : '') + '" ' + (attrs || '') + '><div class="label">' + label + '</div>' +
      '<div class="value num">' + value + '</div>' + (sub || '') + '</div>';
  }
  function bars(list, total, colorFn, rowAttr) {
    if (!list.length) return '<div class="empty">Нет данных за период</div>';
    const max = Math.max.apply(null, list.map(x => x.sum).concat([1]));
    return list.map((x, i) =>
      '<div class="bar-row' + (rowAttr && rowAttr(x) ? ' click" ' + rowAttr(x) : '"') + '><div class="bar-top"><span class="name">' + esc(x.name) + '</span>' +
      '<span class="val num">' + short(x.sum) + (total ? ' · ' + Math.round(x.sum / total * 100) + '%' : '') + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.max(2, x.sum / max * 100) + '%;background:' + colorFn(i) + '"></i></div></div>').join('');
  }
  const clientAttr = x => x.key ? 'data-client="' + x.key + '"' : '';

  function destroyCharts() { Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
  const tickColor = '#8a8f98', gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';

  // ================= ГЛАВНАЯ =================
  const MODES = [['month', 'Месяц'], ['quarter', 'Квартал'], ['year', 'Год']];
  const STATUS = {
    ok: { text: 'Норма', cls: 'b-ok' },
    warn: { text: 'Внимание', cls: 'b-warn' },
    risk: { text: 'Риск', cls: 'b-risk' }
  };
  const NEWS_ICON = { bad: ['i-risk', 'alert'], good: ['i-ok', 'up'], warn: ['i-warn', 'warn'], info: ['i-info', 'coins'] };
  let home = null;

  function homeShell(d) {
    const p = d ? d.period : { label: '…', sub: 'загрузка из 1С', canPrev: false, canNext: false };
    return header('Ваш бизнес', d ? 'обновлено ' + esc(d.updated) : 'загрузка из 1С…') +
      '<div class="seg">' + MODES.map(m => '<button class="' + (m[0] === S.mode ? 'on' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>').join('') + '</div>' +
      '<div class="period">' +
        '<button class="arrow" data-step="-1" aria-label="Предыдущий период"' + (p.canPrev ? '' : ' disabled') + '>' + I('left', 22, 2.2) + '</button>' +
        '<div class="pl"><div class="t">' + esc(p.label) + '</div><div class="s' + (p.prelim ? ' prelim' : '') + '">' + esc(p.sub) + '</div></div>' +
        '<button class="arrow" data-step="1" aria-label="Следующий период"' + (p.canNext ? '' : ' disabled') + '>' + I('right', 22, 2.2) + '</button>' +
      '</div>';
  }

  async function renderHome(refresh) {
    screen.innerHTML = homeShell(null) + skel(150, 190, 140, 140, 220);
    let d;
    try { d = await api({ api: 'home', mode: S.mode, offset: S.offset[S.mode] }, { refresh }); }
    catch (e) { screen.innerHTML = homeShell(null) + errorState(e); return; }
    if (S.tab !== 'home') return;
    home = d;
    const k = d.kpi, p = d.period;

    let deltaPill;
    if (k.netPct === null) deltaPill = '<span class="pill flat">' + (p.prelim ? 'период ещё идёт' : 'нет сравнения') + '</span>';
    else deltaPill = '<span class="pill ' + (k.netPct >= 0 ? 'up' : 'down') + '">' + (k.netPct >= 0 ? '▲ ' : '▼ ') + Math.abs(k.netPct) + '%</span><span>' + esc(p.prevText) + '</span>';

    const maxAbs = Math.max.apply(null, d.bars.map(b => Math.abs(b.net)).concat([1]));
    const barsHtml = d.bars.map(b => {
      const h = b.net > 0 ? Math.max(4, Math.round(b.net / maxAbs * 86)) : 0;
      const nh = b.net < 0 ? Math.max(4, Math.min(16, Math.round(Math.abs(b.net) / maxAbs * 86))) : 0;
      const cls = (b.net < 0 ? 'neg' : b.sel ? 'sel' : '') + (b.prelim ? ' pre' : '');
      return '<button class="bcol" data-month="' + b.y + ',' + b.m + '" aria-label="' + esc(b.label) + ': ' + esc(short(b.net)) + '">' +
        '<span class="bv' + (b.sel ? ' on' : '') + (b.net < 0 ? ' red' : '') + '">' + mlnShort(b.net) + '</span>' +
        '<span class="bwrap"><span class="cb ' + cls + '" style="height:' + h + 'px"></span></span>' +
        '<span class="base"></span><span class="nwrap"><span class="cb neg' + (b.prelim ? ' pre' : '') + '" style="height:' + nh + 'px"></span></span>' +
        '<span class="bl' + (b.sel ? ' on' : '') + '">' + esc(b.label) + '</span></button>';
    }).join('');

    screen.innerHTML = homeShell(d) +
      (p.prelim ? '<div class="banner fade-in">' + I('clock', 18) + '<span>' + (p.mode === 'year'
        ? 'Год ещё не закончился: показаны данные с января по сегодня. Цифры текущего месяца предварительные.'
        : 'Период ещё не закрыт: часть расходов (зарплату, амортизацию) бухгалтер вносит в конце месяца. Цифры предварительные.') + '</span></div>' : '') +

      '<button class="card hero tap fade-in" data-sheet="profit">' +
        '<div class="label row-between"><span>Чистая прибыль</span><span class="link">Из чего' + I('right', 16, 2.2) + '</span></div>' +
        '<div class="big num" style="color:' + (k.net < 0 ? 'var(--red)' : 'var(--text)') + '">' + fmt(k.net) + '</div>' +
        '<div class="meta">' + deltaPill + '</div>' +
        '<div class="meta split"><span>Выручка <b class="num">' + short(k.revenue) + '</b></span><span>Рентабельность <b>' + k.margin + '%</b></span></div>' +
      '</button>' +

      '<div class="card fade-in"><h2>Прибыль по месяцам <small>нажмите на месяц</small></h2>' +
        '<div class="bars" style="grid-template-columns:repeat(' + d.bars.length + ',minmax(0,1fr))">' + barsHtml + '</div></div>' +

      '<div class="grid fade-in">' + d.tiles.map(t =>
        '<button class="kpi tile" data-sheet="' + t.kind + '">' +
          '<span class="row-between"><span class="badge ' + STATUS[t.status].cls + '"><i></i>' + STATUS[t.status].text + '</span><span class="chev">' + I('right', 16, 2.2) + '</span></span>' +
          '<span class="tt">' + esc(t.title) + '</span><span class="value num">' + esc(t.value) + '</span><span class="small">' + esc(t.note) + '</span>' +
        '</button>').join('') + '</div>' +

      '<div class="section-title fade-in"><span>Что важно</span><small>' + esc(p.label) + '</small></div>' +
      (d.news.length ? d.news.map(n =>
        '<div class="card news fade-in"><span class="ic ' + NEWS_ICON[n.kind][0] + '">' + I(NEWS_ICON[n.kind][1], 18) + '</span>' +
        '<div><div class="nt">' + esc(n.title) + '</div><div class="nx">' + esc(n.text) + '</div></div></div>').join('')
        : '<div class="card news fade-in"><span class="ic i-ok">' + I('check', 18, 2.4) + '</span><div><div class="nt">Всё спокойно</div><div class="nx">За период не было ничего необычного</div></div></div>') +

      (d.tips.length ? '<div class="section-title fade-in"><span>Советы</span></div>' +
        '<div class="card tips fade-in">' + d.tips.map((t, i) =>
          '<div class="tipr"><span class="num-badge">' + (i + 1) + '</span><div class="tb"><div>' + esc(t.text) + '</div>' +
          (t.action ? '<button class="btn-small" ' + (t.act.type === 'act' ? 'data-actc="' + t.act.client + '" data-ap="ty"' : 'data-sheet="' + t.act.kind + '"') + '>' + I(t.act.type === 'act' ? 'act' : 'chart', 16) + esc(t.action) + '</button>' : '') +
          '</div></div>').join('') + '</div>' : '') +

      '<div class="actions fade-in">' +
        '<button class="btn" data-send="report">' + I('send', 18) + 'Отчёт в чат</button>' +
        '<button class="btn secondary" data-send="excel">' + I('download', 18) + 'Excel в чат</button>' +
      '</div>';
  }

  function mlnShort(n) {
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e6) return s + (a / 1e6).toFixed(1).replace('.', ',');
    if (a >= 1e3) return s + Math.round(a / 1e3) + 'к';
    return s + Math.round(a);
  }

  // ================= ОКНА С ПОДРОБНОСТЯМИ =================
  function openSheet(html) {
    const sheet = document.getElementById('sheet');
    S.sheet = true; updateBack();
    document.getElementById('backdrop').classList.add('show');
    sheet.innerHTML = '<div class="grabber"></div>' + html;
    sheet.scrollTop = 0;
    sheet.classList.add('show');
  }
  function sheetHead(title, sub) {
    return '<div class="top"><div style="min-width:0"><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
      '<button class="icon-btn" data-close aria-label="Закрыть">' + I('close', 18, 2.2) + '</button></div>';
  }
  function lines(rows) {
    return '<div class="card">' + rows.map(r =>
      '<div class="line' + (r.bold ? ' bold' : '') + '"><span>' + esc(r.name) + (r.note ? '<small>' + esc(r.note) + '</small>' : '') + '</span>' +
      '<span class="num" style="' + (r.color ? 'color:' + r.color : '') + '">' + r.value + '</span></div>').join('') + '</div>';
  }

  function showSheet(kind) {
    if (!home) return;
    haptic();
    const d = home, k = d.kpi;
    if (kind === 'profit') {
      const rows = [{ name: 'Выручка', value: fmt(k.revenue) },
        { name: 'Себестоимость', note: 'зарплата и налоги сотрудников и др.', value: '−' + fmt(k.cost) },
        { name: 'Расходы периода', note: 'аренда, услуги, банк и др.', value: '−' + fmt(k.opex) }];
      if (k.otherIncome) rows.push({ name: 'Прочие доходы', value: '+' + fmt(k.otherIncome) });
      if (k.tax) rows.push({ name: 'КПН', value: '−' + fmt(k.tax) });
      rows.push({ name: 'Чистая прибыль', value: fmt(k.net), bold: true, color: k.net < 0 ? 'var(--red)' : 'var(--green)' });
      openSheet(sheetHead('Из чего прибыль', esc(d.period.label)) + lines(rows) +
        '<div class="card"><h2>Куда уходят деньги</h2>' + bars(d.structure, d.structure.reduce((s, x) => s + x.sum, 0), i => COLORS[i % COLORS.length]) + '</div>');
    } else if (kind === 'cash') {
      const c = d.cash;
      openSheet(sheetHead('Деньги на счетах', 'остаток на сегодня') +
        lines(c.accounts.map(a => ({ name: a.name, value: short(a.sum) })).concat([{ name: 'Всего', value: fmt(c.total), bold: true }])) +
        (c.cover !== null ? lines([{ name: 'Расходы в среднем за месяц', note: 'по последним 3 закрытым месяцам', value: short(c.avgExp) },
          { name: 'Хватит на', value: String(c.cover).replace('.', ',') + ' мес.', bold: true, color: c.cover >= 2 ? 'var(--green)' : c.cover >= 1 ? 'var(--yellow)' : 'var(--red)' }]) : '') +
        '<div class="actions one"><button class="btn secondary" data-go="money">Все счета и долги' + I('right', 18, 2.2) + '</button></div>');
    } else if (kind === 'debts') {
      const list = d.debts.list;
      openSheet(sheetHead('Долги клиентов', 'на сегодня · ' + list.length + ' клиент(ов) · ' + short(d.debts.total)) +
        '<div class="card">' + (list.length ? list.map(x =>
          '<div class="row">' + avatar(x.name) + '<div class="info click" data-client="' + x.key + '"><div class="n">' + esc(x.name) + '</div>' +
          '<div class="s red num">' + fmt(x.sum) + '</div></div><button class="btn-small" data-actc="' + x.key + '" data-ap="ty">' + I('act', 16) + 'Акт</button></div>').join('')
          : '<div class="empty">Никто не должен</div>') + '</div>');
    } else if (kind === 'expenses') {
      const total = d.structure.reduce((s, x) => s + x.sum, 0);
      openSheet(sheetHead('Куда уходят деньги', esc(d.period.label) + ' · ' + short(total)) +
        '<div class="card">' + bars(d.structure, total, i => COLORS[i % COLORS.length]) + '</div>' +
        '<div class="actions one"><button class="btn secondary" data-send="excel">' + I('download', 18) + 'Расшифровка в Excel</button></div>');
    }
  }

  // детали месяца (тап по столбику графика)
  async function openMonth(y, m) {
    haptic();
    openSheet(skel(120, 90, 180));
    let d;
    try { d = await api({ api: 'month', y: y, m: m }); }
    catch (e) { openSheet(errorState(e)); return; }
    const k = d.kpi;
    const total = d.structure.reduce((s, x) => s + x.sum, 0);
    openSheet(sheetHead(d.label, d.open ? 'месяц не закрыт · предварительно' : 'сравнение с ' + esc(d.prevLabel)) +
      '<div class="card hero"><div class="label">Чистая прибыль</div><div class="big num" style="color:' + (k.net >= 0 ? 'var(--text)' : 'var(--red)') + '">' + fmt(k.net) + '</div>' +
        '<div class="meta">' + (d.open ? '' : delta(k.net, k.netPrev)) + '<span>Рентабельность <b>' + (k.revenue ? Math.round(k.net / k.revenue * 100) : 0) + '%</b></span></div></div>' +
      '<div class="grid">' + kpi('Выручка', short(k.revenue), d.open ? '' : delta(k.revenue, k.revenuePrev), 'var(--blue)') +
        kpi('Расходы', short(k.expenses), d.open ? '' : delta(k.expenses, k.expensesPrev, true), 'var(--orange)') + '</div>' +
      '<div class="card"><h2>Откуда пришли деньги</h2>' + bars(d.clients, k.revenue, () => 'var(--blue)', clientAttr) + '</div>' +
      '<div class="card"><h2>Куда ушли деньги <small>' + short(total) + '</small></h2>' + bars(d.structure, total, i => COLORS[i % COLORS.length]) + '</div>');
  }
  function closeSheet() {
    S.sheet = false; updateBack();
    document.getElementById('sheet').classList.remove('show');
    document.getElementById('backdrop').classList.remove('show');
  }

  // ================= ОБЩИЕ ЭЛЕМЕНТЫ ЭКРАНОВ =================
  const sec = (title, small) => '<div class="section-title fade-in"><span>' + title + '</span>' + (small ? '<small>' + small + '</small>' : '') + '</div>';
  const iconBox = (name, tone) => '<div class="avatar ib ' + (tone || 'blue') + '">' + I(name, 18) + '</div>';
  const stat = (label, value, sub) => '<div class="kpi stat"><div class="label">' + label + '</div><div class="value num">' + value + '</div>' + (sub ? '<div class="small">' + sub + '</div>' : '') + '</div>';
  const sendBtn = (attrs, text) => '<button class="btn-small" ' + attrs + '>' + I('send', 15) + (text || 'В чат') + '</button>';

  // ================= ОТЧЁТЫ =================
  function renderReports() {
    if (S.payroll) return renderPayroll();
    const label = home ? home.period.label : 'выбранный период';
    const item = (icon, tone, title, sub, right) =>
      '<div class="row">' + iconBox(icon, tone) + '<div class="info"><div class="n">' + title + '</div><div class="s">' + sub + '</div></div>' + right + '</div>';
    screen.innerHTML = header('Отчёты', 'файлы приходят в чат с ботом', { refresh: false }) +
      sec('Зарплата') +
      '<div class="card fade-in"><div class="row click" data-payroll>' + iconBox('users', 'violet') +
        '<div class="info"><div class="n">Начислено и выплачено</div><div class="s">по сотрудникам и месяцам</div></div>' +
        '<span class="chev">' + I('right', 18, 2.2) + '</span></div></div>' +
      sec('Excel за период', esc(label)) +
      '<div class="card fade-in">' +
        item('chart', 'blue', 'Прибыль и расходы', 'с расшифровкой по статьям', sendBtn('data-rx="profit"')) +
        item('coins', 'green', 'Доходы по клиентам', 'выручка по клиентам и договорам', sendBtn('data-rx="income"')) +
        item('users', 'violet', 'Зарплата', 'по сотрудникам и месяцам', sendBtn('data-rx="payroll"')) +
      '</div>' +
      sec('На сегодня') +
      '<div class="card fade-in">' +
        item('wallet', 'orange', 'Деньги и долги', 'остатки, должники, поставщики', sendBtn('data-rx="money"')) +
      '</div>' +
      '<div class="tip-text fade-in">Период для отчётов — тот, что выбран на главной. Акт сверки — в карточке клиента или в списке должников.</div>';
  }

  // ================= КЛИЕНТЫ =================
  async function renderClients(refresh) {
    if (S.client) return renderClient(S.client, refresh);
    const shell = header('Клиенты', 'выручка за ' + new Date().getFullYear() + ' и долги на сегодня');
    screen.innerHTML = shell + skel(46, 46, 90, 300);
    let list;
    try { list = await api({ api: 'clients' }, { refresh }); }
    catch (e) { screen.innerHTML = shell + errorState(e); return; }
    if (S.tab !== 'clients' || S.client) return;
    const totalRev = list.reduce((s, c) => s + Math.max(0, c.revenue), 0);
    const totalDebt = list.reduce((s, c) => s + Math.max(0, c.debt), 0);
    const debtors = list.filter(c => c.debt >= 1).length;

    screen.innerHTML = shell +
      '<label class="search-wrap">' + I('search', 18) +
        '<input class="search" id="search" type="search" placeholder="Поиск клиента" aria-label="Поиск клиента" value="' + esc(S.search) + '"></label>' +
      '<div class="seg two">' +
        '<button class="' + (S.clientFilter === 'all' ? 'on' : '') + '" data-cf="all">Все · ' + list.length + '</button>' +
        '<button class="' + (S.clientFilter === 'debt' ? 'on' : '') + '" data-cf="debt">Должники · ' + debtors + '</button></div>' +
      '<div class="grid fade-in" style="margin-top:12px">' + stat('Выручка за год', short(totalRev)) + stat('Должны нам', '<span class="' + (totalDebt >= 1 ? 'red' : '') + '">' + short(totalDebt) + '</span>') + '</div>' +
      '<div class="card fade-in" id="clientList"></div>';

    const draw = () => {
      const q = S.search.toLowerCase().trim();
      const rows = list.filter(c => (!q || c.name.toLowerCase().includes(q)) && (S.clientFilter === 'all' || c.debt >= 1));
      document.getElementById('clientList').innerHTML = rows.length ? rows.map(c =>
        '<div class="row click" data-client="' + c.key + '">' + avatar(c.name) +
        '<div class="info"><div class="n">' + esc(c.name) + '</div><div class="s num">выручка ' + short(c.revenue) + '</div></div>' +
        '<div class="right num">' + (c.debt >= 1 ? '<span class="red">' + short(c.debt) + '</span><div class="s">долг</div>'
          : c.debt <= -1 ? '<span class="green">' + short(-c.debt) + '</span><div class="s">аванс</div>'
          : '<span class="muted">' + I('check', 16, 2.4) + '</span>') + '</div></div>'
      ).join('') : '<div class="empty">Никого не нашли</div>';
    };
    draw();
    document.getElementById('search').addEventListener('input', e => { S.search = e.target.value; draw(); });
  }

  async function renderClient(key, refresh) {
    const shell = header('Клиент', '', { back: 'Клиенты' });
    screen.innerHTML = shell + skel(90, 180, 200);
    updateBack();
    let c;
    try { c = await api({ api: 'client', key: key }, { refresh }); }
    catch (e) { screen.innerHTML = shell + errorState(e); return; }
    if (S.client !== key) return;
    const debtVal = c.debt >= 1 ? '<span class="red">' + short(c.debt) + '</span>' : c.debt <= -1 ? '<span class="green">' + short(-c.debt) + '</span>' : '<span class="green">нет</span>';

    screen.innerHTML = header(c.name, c.lastPayment ? 'последняя оплата ' + c.lastPayment.date + ' · ' + short(c.lastPayment.sum) : 'оплат в этом и прошлом году не было', { back: 'Клиенты' }) +
      '<div class="grid three fade-in">' +
        stat('Выручка', short(c.revenueYear), 'за ' + c.year + ' год') +
        stat(c.debt <= -1 ? 'Аванс' : 'Долг', debtVal, c.debt <= -1 ? 'оплачено вперёд' : 'на сегодня') +
        stat('Договоров', String(c.contracts.length), '') +
      '</div>' +
      (c.payable >= 1 ? '<div class="banner fade-in">' + I('out', 18) + '<span>Мы должны этому контрагенту как поставщику: <b>' + fmt(c.payable) + '</b></span></div>' : '') +
      sec('Выручка по месяцам', '12 мес., млн ₸') +
      '<div class="card fade-in"><div class="chart-wrap small"><canvas id="clientChart"></canvas></div></div>' +
      sec('Договоры') +
      '<div class="card fade-in">' + (c.contracts.length ? c.contracts.map(x =>
        '<div class="contract"><div class="t">' + I('file', 16) + '<span>' + esc(x.name) + '</span></div>' +
        (x.percent != null ? '<div class="bar"><i style="width:' + Math.min(100, Math.max(2, x.percent)) + '%;background:var(--green)"></i></div>' : '') +
        '<div class="facts">' + (x.sum ? '<span>Сумма <b class="num">' + short(x.sum) + '</b></span>' : '') +
        '<span>Отгружено <b class="num">' + short(x.shipped) + '</b></span><span>Оплачено <b class="num">' + short(x.paid) + '</b></span>' +
        (x.debt >= 1 ? '<span>Долг <b class="red num">' + short(x.debt) + '</b></span>' : '') +
        (x.percent != null ? '<span>Закрыт <b>' + x.percent + '%</b></span>' : '') + '</div></div>'
      ).join('') : '<div class="empty">Договоров с покупателем нет</div>') + '</div>' +
      '<div class="actions fade-in" style="margin-top:12px">' +
        '<button class="btn" data-actc="' + key + '" data-ap="ty">' + I('act', 18) + 'Акт за год</button>' +
        '<button class="btn secondary" data-actc="' + key + '" data-ap="ly">' + I('act', 18) + 'За прошлый год</button>' +
      '</div>' +
      '<div class="actions one fade-in"><button class="btn secondary" data-cxls="' + key + '">' + I('download', 18) + 'Договоры в Excel</button></div>';

    const el = document.getElementById('clientChart');
    if (el && window.Chart) {
      charts.client = new Chart(el, {
        type: 'bar',
        data: { labels: c.series.labels, datasets: [{ data: c.series.revenue.map(v => Math.round(v / 1e5) / 10), backgroundColor: '#2a78d6', borderRadius: 5, maxBarThickness: 14 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false },
          tooltip: { callbacks: { label: x => ' ' + x.parsed.y.toFixed(1).replace('.', ',') + ' млн ₸' } } },
          scales: { x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10, family: 'Inter' }, autoSkip: false, maxRotation: 0 } },
                    y: { grid: { color: gridColor }, border: { display: false }, ticks: { color: tickColor, font: { size: 10, family: 'Inter' } } } } }
      });
    }
  }

  // ================= ДЕНЬГИ =================
  async function renderMoney(refresh) {
    const shell = header('Деньги и долги', 'на сегодня');
    screen.innerHTML = shell + skel(130, 160, 200);
    let d;
    try { d = await api({ api: 'money' }, { refresh }); }
    catch (e) { screen.innerHTML = shell + errorState(e); return; }
    if (S.tab !== 'money') return;
    const balance = d.cashTotal + d.debtTotal - d.credTotal;

    screen.innerHTML = header('Деньги и долги', 'обновлено ' + esc(d.updated)) +
      '<div class="card hero fade-in"><div class="label">На счетах и в кассе</div><div class="big num">' + fmt(d.cashTotal) + '</div>' +
        '<div class="meta split"><span>Нам должны <b class="num">' + short(d.debtTotal) + '</b></span><span>Мы должны <b class="num">' + short(d.credTotal) + '</b></span></div>' +
        '<div class="meta" style="margin-top:8px"><span>Итого с учётом долгов <b class="num">' + short(balance) + '</b></span></div></div>' +
      sec('Счета') +
      '<div class="card fade-in">' + (d.cash.length ? d.cash.map(x =>
        '<div class="row">' + iconBox('bank', 'violet') + '<div class="info"><div class="n">' + esc(x.name) + '</div></div><div class="right num">' + short(x.sum) + '</div></div>'
      ).join('') : '<div class="empty">Нет остатков</div>') + '</div>' +
      sec('Нам должны', short(d.debtTotal)) +
      '<div class="card fade-in">' + (d.debtors.length ? d.debtors.map(x =>
        '<div class="row">' + avatar(x.name) + '<div class="info click" data-client="' + x.key + '"><div class="n">' + esc(x.name) + '</div><div class="s red num">' + fmt(x.sum) + '</div></div>' +
        '<button class="btn-small" data-actc="' + x.key + '" data-ap="ty">' + I('act', 15) + 'Акт</button></div>'
      ).join('') : '<div class="empty">Никто не должен</div>') + '</div>' +
      sec('Мы должны', short(d.credTotal)) +
      '<div class="card fade-in">' + (d.creditors.length ? d.creditors.map(x =>
        '<div class="row">' + avatar(x.name) + '<div class="info"><div class="n">' + esc(x.name) + '</div><div class="s">поставщик</div></div><div class="right num">' + short(x.sum) + '</div></div>'
      ).join('') : '<div class="empty">Долгов перед поставщиками нет</div>') + '</div>' +
      '<div class="actions one fade-in" style="margin-top:12px"><button class="btn" data-mxls>' + I('download', 18) + 'Excel в чат</button></div>';
  }

  // ================= ЗАРПЛАТА =================
  async function renderPayroll(refresh) {
    const shell = header('Зарплата', 'начислено и выплачено', { back: 'Отчёты' }) + chips(S.payPeriod, 'data-pp');
    screen.innerHTML = shell + skel(90, 160, 160);
    let d;
    try { d = await api({ api: 'payroll', period: S.payPeriod }, { refresh }); }
    catch (e) { screen.innerHTML = shell + errorState(e); return; }
    if (S.tab !== 'reports' || !S.payroll) return;
    const t = d.total;

    screen.innerHTML = header('Зарплата', esc(d.label) + ' · сотрудников: ' + d.headcount, { back: 'Отчёты' }) + chips(S.payPeriod, 'data-pp') +
      '<div class="grid three fade-in">' +
        stat('Начислено', short(t.accrued)) +
        stat('На руки', short(t.net), 'удержано ' + short(t.withheld)) +
        stat('Выплачено', short(t.paid)) +
      '</div>' +
      (d.months.length ? d.months.map((m, i) =>
        '<div class="card month fade-in' + (i === 0 ? ' open' : '') + '"><div class="month-head" data-toggle>' +
          '<div><div style="font-weight:600">' + esc(m.label) + '</div><div class="s" style="color:var(--hint);font-size:13px">начислено ' + short(m.accrued) + ' · выплачено ' + short(m.paid) + '</div></div>' +
          '<span class="chev">' + I('right', 18, 2.2) + '</span></div>' +
          '<div class="people">' + (m.people.length ? m.people.map(p =>
            '<div class="row">' + avatar(p.name) + '<div class="info"><div class="n">' + esc(p.name) + '</div>' +
            '<div class="s num">начислено ' + short(p.accrued) + ' · выплачено ' + short(p.paid) + '</div></div>' +
            '<div class="right num">' + short(p.net) + '<div class="s">на руки</div></div></div>'
          ).join('') : '<div class="empty">Нет начислений</div>') + '</div></div>'
      ).join('') : '<div class="card"><div class="empty">Нет данных за период</div></div>') +
      '<div class="actions one fade-in" style="margin-top:12px"><button class="btn" data-pxls>' + I('download', 18) + 'Excel в чат</button></div>';
  }


  // ================= навигация =================
  function render(refresh) {
    destroyCharts();
    window.scrollTo(0, 0);
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === S.tab));
    updateBack();
    if (!tg || !tg.initData) {
      screen.innerHTML = state('phone', 'Откройте панель из бота', 'Панель работает только внутри Telegram — нажмите кнопку «📱 Панель» в чате с ботом.');
      return;
    }
    if (S.tab === 'home') renderHome(refresh);
    else if (S.tab === 'clients') renderClients(refresh);
    else if (S.tab === 'money') renderMoney(refresh);
    else renderReports(refresh);
  }

  function goTab(tab) { closeSheet(); S.tab = tab; S.client = null; S.payroll = false; render(); }
  function openClient(key) { closeSheet(); haptic(); S.tab = 'clients'; S.client = key; render(); }
  function goBack() {
    if (S.sheet) return closeSheet();
    if (S.client) { S.client = null; render(); return; }
    if (S.payroll) { S.payroll = false; render(); }
  }
  function updateBack() {
    if (!tg || !tg.BackButton) return;
    if (S.sheet || S.client || S.payroll) tg.BackButton.show(); else tg.BackButton.hide();
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  document.querySelector('.tabbar').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    haptic();
    if (b.dataset.tab === S.tab && (S.client || S.payroll)) { S.client = null; S.payroll = false; render(); return; }
    goTab(b.dataset.tab);
  });
  document.getElementById('backdrop').addEventListener('click', closeSheet);

  // параметры периода главной — для отчётов в чат
  const homeReq = () => ({ mode: S.mode, offset: S.offset[S.mode] });

  function onClick(e) {
    const t = e.target.closest('[data-mode],[data-step],[data-month],[data-sheet],[data-pp],[data-cf],[data-client],[data-go],[data-back],[data-refresh],[data-close],[data-send],[data-actc],[data-cxls],[data-mxls],[data-pxls],[data-toggle],[data-payroll],[data-rx]');
    if (!t || t.disabled) return;
    const ds = t.dataset;
    if (ds.mode) { if (ds.mode !== S.mode) { haptic(); S.mode = ds.mode; render(); } return; }
    if (ds.step) { haptic(); S.offset[S.mode] += Number(ds.step); render(); return; }
    if (ds.month) { const a = ds.month.split(','); return openMonth(a[0], a[1]); }
    if (ds.sheet) return showSheet(ds.sheet);
    if (ds.pp) { if (ds.pp !== S.payPeriod) { haptic(); S.payPeriod = ds.pp; render(); } return; }
    if (ds.cf) { haptic(); S.clientFilter = ds.cf; render(); return; }
    if (ds.client) return openClient(ds.client);
    if (ds.go) { haptic(); return goTab(ds.go); }
    if ('payroll' in ds) { haptic(); S.payroll = true; return render(); }
    if ('back' in ds) return goBack();
    if ('close' in ds) return closeSheet();
    if ('refresh' in ds) {
      haptic(); t.classList.add('spin');
      Object.keys(memo).forEach(k => delete memo[k]);
      return render(true);
    }
    if ('toggle' in ds) { haptic(); t.parentElement.classList.toggle('open'); return; }
    if (ds.send === 'report') return action(t, Object.assign({ api: 'report', type: 'profit' }, homeReq()), 'Отчёт о прибыли отправлен в чат');
    if (ds.send === 'excel') return action(t, Object.assign({ api: 'excel', type: 'profit' }, homeReq()), 'Excel отправлен в чат');
    if (ds.rx) return action(t, ds.rx === 'money' ? { api: 'excel', type: 'money' } : Object.assign({ api: 'excel', type: ds.rx }, homeReq()), 'Excel отправлен в чат');
    if (ds.actc) return action(t, { api: 'act', client: ds.actc, period: ds.ap || 'ty' }, 'Акт сверки отправлен в чат');
    if (ds.cxls) return action(t, { api: 'excel', type: 'contracts', client: ds.cxls }, 'Договоры в Excel отправлены в чат');
    if ('mxls' in ds) return action(t, { api: 'excel', type: 'money' }, 'Excel отправлен в чат');
    if ('pxls' in ds) return action(t, { api: 'excel', type: 'payroll', period: S.payPeriod }, 'Excel отправлен в чат');
  }
  screen.addEventListener('click', onClick);
  document.getElementById('sheet').addEventListener('click', onClick);

  render();
</script>
</body>
</html>
